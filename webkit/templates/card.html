<div class="{{CLS}}" data-owned="{{OWNED}}" data-claiming="{{CLAIMING}}" data-style="{{STYLE_VARS}}">
  <div class="fgg-card-frame">
    <img class="fgg-card-bg" src="{{HERO_SRC}}" data-fallback-src="{{HERO_FALLBACK}}"/>
    <div class="fgg-card-overlay"></div>
    <div class="fgg-card-accent"></div>
    <div class="fgg-card-content">
      <img class="fgg-card-thumb" src="{{HEADER_SRC}}" data-fallback-src="{{HEADER_FALLBACK}}"/>
      <div class="fgg-card-text">
        <div class="fgg-card-name">{{NAME}}</div>
        <div class="fgg-card-status">
          <span class="fgg-card-dot"></span>
          {{STATUS}}
        </div>
      </div>
      {{TRAILING}}
    </div>
  </div>
</div>
